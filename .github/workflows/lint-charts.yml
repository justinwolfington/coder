name: Lint Charts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      # terraform_docs runs now that the hooks cover templates/ and modules/,
      # and the action set did not provide its binary.
      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: 0.24.0
          TERRAFORM_DOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/terraform-docs.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          echo "${TERRAFORM_DOCS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xz -C "${RUNNER_TEMP}/bin" -f "${archive}" terraform-docs
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # terraform_validate resolves the templates' git:: module sources, which
      # live in this private repo.
      - name: Authenticate module fetches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          # git ls-files rather than a glob: the action runs without globstar,
          # so charts/**/* only ever matched one directory level.
          extra_args: --files $(git ls-files -- charts templates modules)
