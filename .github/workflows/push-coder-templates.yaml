name: Push Coder Templates

on:
  # Run after successful build/promotion of artifacts
  workflow_run:
    workflows: ["Build and Promote Artifacts"]
    types:
      - completed
    branches:
      - main

  # Run on pull requests to test templates
  pull_request:
    branches:
      - main
      - taruj/custom-images-for-templates
      # - add branch name here to test templates on that branch
    paths:
      - "templates/**"
      - ".github/workflows/push-coder-templates.yaml"

  # Allow manual trigger for debugging
  workflow_dispatch:
    inputs:
      template_name:
        description: 'Specific template name to push (optional, pushes all if empty)'
        required: false
        type: string
      environment:
        description: 'Environment to deploy to (development, staging, production)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read

jobs:
  push-templates:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: abridge-runner-${{ github.event.inputs.environment || 'development' }}
    environment: ${{ github.event.inputs.environment || 'development' }}
    strategy:
      matrix:
        template:
          - name: "gpu-k8s"
            directory: "./templates/gpu-k8s"
          - name: "clinician-k8s"
            directory: "./templates/clinician-k8s"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get short commit SHA
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHA="${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          SHORT_SHA="${SHA:0:7}"
          echo "sha_short=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Using SHA: $SHA (short: $SHORT_SHA)"

      - name: Setup Coder CLI
        uses: coder/setup-action@v1
        with:
          access_url: ${{ vars.CODER_ACCESS_URL }}
          coder_session_token: ${{ secrets.CODER_SESSION_TOKEN }}

      - name: Push template ${{ matrix.template.name }}
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.template_name == '' || github.event.inputs.template_name == matrix.template.name
        run: |
          echo "Pushing template: ${{ matrix.template.name }}"
          echo "Directory: ${{ matrix.template.directory }}"
          echo "Version: ${{ steps.vars.outputs.sha_short }}"

          coder templates push ${{ matrix.template.name }} \
            --directory "${{ matrix.template.directory }}" \
            --name "${{ steps.vars.outputs.sha_short }}" \
            --yes

      - name: Notify on success
        if: success()
        run: |
          echo "Successfully pushed template: ${{ matrix.template.name }}"
          echo "Version: ${{ steps.vars.outputs.sha_short }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Failed to push template: ${{ matrix.template.name }}"
          echo "Please check the logs above for details"
