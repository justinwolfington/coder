name: Publish Coder Templates

on:
  # Run after successful build/promotion of artifacts
  workflow_run:
    workflows: ["Build and Promote Artifacts"]
    types:
      - completed
    branches:
      - main

  # Run on pull requests to test templates
  pull_request:
    branches:
      - main
    paths:
      - "templates/**"
      - "modules/**"
      - ".github/workflows/push-coder-templates.yaml"

  # Allow manual trigger for debugging
  workflow_dispatch:
    inputs:
      template_name:
        description: "Specific template name to push (optional, pushes all if empty)"
        required: false
        type: string
      environment:
        description: "Environment to deploy to (development, staging, production)"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - staging
          - production
      module_version:
        description: "Module version to use (optional, uses environment default if empty)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  push-templates:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' && github.event.pull_request.draft == false|| github.event.workflow_run.conclusion == 'success'
    runs-on: abridge-runner-${{ github.event.inputs.environment || 'development' }}
    environment: ${{ github.event.inputs.environment || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure Git for private repos
        run: |
          git config --global url."https://${{ secrets.ABRIDGE_GH_BOT}}@github.com/".insteadOf "https://github.com/"

      - name: Setup Coder CLI
        uses: coder/setup-action@v1
        with:
          access_url: ${{ vars.CODER_ACCESS_URL }}
          coder_session_token: ${{ secrets.CODER_SESSION_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: |
          SHA="${{ github.event_name == 'workflow_dispatch' && github.sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}"
          [[ -z "$SHA" ]] && SHA=$(git rev-parse HEAD)
          echo "sha_short=${SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Check if module version provided
        id: module-version
        run: |
          PROVIDED_VERSION="${{ github.event.inputs.module_version }}"

          if [ -n "$PROVIDED_VERSION" ]; then
            echo "update_modules=true" >> $GITHUB_OUTPUT
            echo "module_version=$PROVIDED_VERSION" >> $GITHUB_OUTPUT
            echo "Will update module references to: $PROVIDED_VERSION"
          else
            echo "update_modules=false" >> $GITHUB_OUTPUT
            echo "No module version provided - templates will use existing references"
          fi

      - name: Update module references in templates
        if: steps.module-version.outputs.update_modules == 'true'
        run: |
          echo "Updating all module references to version: ${{ steps.module-version.outputs.module_version }}"
          find templates/ -name "*.tf" -exec sed -i 's|git::https://github.com/abridgeai/coder.git//modules/\([^?]*\)?ref=[^"]*|git::https://github.com/abridgeai/coder.git//modules/\1?ref=${{ steps.module-version.outputs.module_version }}|g' {} \;

      - name: Create environment tfvars in each template directory
        run: |
          echo "Creating terraform.auto.tfvars with environment and coder_url in each template"
          for template_dir in templates/*/; do
            if [ -f "${template_dir}main.tf" ]; then
              cat > "${template_dir}terraform.auto.tfvars" <<EOF
          environment = "${{ github.event.inputs.environment || 'development' }}"
          coder_url   = "${{ vars.CODER_ACCESS_URL }}"
          EOF
              echo "Created tfvars in ${template_dir}"
            fi
          done

      - name: Initialize Terraform
        working-directory: ./templates
        run: terraform init

      - name: Create tfvars file
        working-directory: ./templates
        run: |
          cat > terraform.auto.tfvars <<EOF
          coder_url = "${{ vars.CODER_ACCESS_URL }}"
          coder_token = "${{ secrets.CODER_SESSION_TOKEN }}"
          environment = "${{ github.event.inputs.environment || 'development' }}"
          template_name = "${{ github.event.inputs.template_name || '' }}"
          commit_sha = "${{ steps.vars.outputs.sha_short }}"
          EOF

      - name: Import existing templates
        working-directory: ./templates
        run: |
          # Import terraform state for templates that already exist
          # This prevents "already exists" errors by recognizing existing templates
          # Template names are extracted from templates-config.tf so new templates
          # are picked up automatically without editing this workflow.
          grep '= merge({' templates-config.tf | sed 's/.*"\([^"]*\)".*/\1/' | while read -r name; do
            echo "Importing template: ${name}"
            terraform import "coderd_template.templates[\"${name}\"]" "coder/${name}" || true
          done

      - name: Validate Terraform configuration
        working-directory: ./templates
        run: terraform validate

      - name: Plan Terraform deployment
        working-directory: ./templates
        run: terraform plan -out=tfplan

      - name: Apply Terraform deployment
        working-directory: ./templates
        # Limit parallelism to avoid the Coder file-upload rate limit
        # (HTTP 429: max 12 requests/min). The default parallelism of 10
        # uploads every template directory concurrently and trips it.
        run: terraform apply -auto-approve -parallelism=2 tfplan

      - name: Show deployment summary
        working-directory: ./templates
        if: always()
        run: terraform output -json deployed_templates

      - name: Clean up sensitive files
        working-directory: ./templates
        if: always()
        run: |
          rm -f terraform.auto.tfvars
          rm -f terraform.tfstate*
          # Clean up template-specific tfvars files
          find . -maxdepth 2 -name "terraform.auto.tfvars" -delete
