name: Publish Coder Templates

on:
  # Run after successful build/promotion of artifacts
  workflow_run:
    workflows: ["Build and Promote Artifacts"]
    types:
      - completed
    branches:
      - main

  # Deploy template changes merged to main. The workflow_run trigger above only
  # fires after a docker/** artifact build, so a template-only merge deployed
  # nothing and sat on main until someone dispatched this by hand.
  push:
    branches:
      - main
    paths:
      - "templates/**"
      - "modules/**"
      - ".github/workflows/push-coder-templates.yaml"

  # Run on pull requests to validate templates
  pull_request:
    branches:
      - main
    paths:
      - "templates/**"
      - "modules/**"
      - ".github/workflows/push-coder-templates.yaml"

  # Allow manual trigger for debugging
  workflow_dispatch:
    inputs:
      template_name:
        description: "Specific template name to push (optional, pushes all if empty)"
        required: false
        type: string
      environment:
        description: "Environment to deploy to (development, staging, production)"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - staging
          - production
      module_version:
        description: "Module version to use (optional, uses environment default if empty)"
        required: false
        type: string

permissions:
  contents: read

# A commit touching both docker/** and templates/** fires workflow_run and push.
# Serialize rather than cancel: cancelling mid-apply would leave a half-applied
# template. The later run may hit a 409 on the duplicate version name, which is
# noisy but harmless - settings are applied before the version is created.
concurrency:
  group: publish-templates-${{ github.event.inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  # A pull request carries untrusted terraform, and plan and apply both execute
  # code the PR author controls, so PRs get a GitHub-hosted runner and no
  # credentials. That rules out plan as well: the coderd provider authenticates
  # against the Coder API when terraform configures it.
  validate-templates:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Initialize Terraform
        working-directory: ./templates
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        working-directory: ./templates
        run: terraform validate

  push-templates:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: abridge-runner-${{ github.event.inputs.environment || 'development' }}
    environment: ${{ github.event.inputs.environment || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "18"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Configure Git for private repos
        env:
          GH_BOT_TOKEN: ${{ secrets.ABRIDGE_GH_BOT }}
        run: |
          git config --global url."https://${GH_BOT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Setup Coder CLI
        uses: coder/setup-action@4a607a8113d4e676e2d7c34caa20a814bc88bfda # v1
        with:
          access_url: ${{ vars.CODER_ACCESS_URL }}
          coder_session_token: ${{ secrets.CODER_SESSION_TOKEN }}

      - name: Get short commit SHA
        id: vars
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          SHA="$EVENT_SHA"
          [[ -z "$SHA" ]] && SHA=$(git rev-parse HEAD)
          echo "sha_short=${SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Check if module version provided
        id: module-version
        env:
          PROVIDED_VERSION: ${{ github.event.inputs.module_version }}
        run: |
          if [ -n "$PROVIDED_VERSION" ]; then
            echo "update_modules=true" >> $GITHUB_OUTPUT
            echo "module_version=$PROVIDED_VERSION" >> $GITHUB_OUTPUT
            echo "Will update module references to: $PROVIDED_VERSION"
          else
            echo "update_modules=false" >> $GITHUB_OUTPUT
            echo "No module version provided - templates will use existing references"
          fi

      - name: Update module references in templates
        if: steps.module-version.outputs.update_modules == 'true'
        env:
          MODULE_VERSION: ${{ steps.module-version.outputs.module_version }}
        run: |
          echo "Updating all module references to version: $MODULE_VERSION"
          find templates/ -name "*.tf" -exec sed -i "s|\(git::https://github.com/abridgeai/coder.git//modules/[^?]*\)?ref=[^\"]*|\1?ref=${MODULE_VERSION}|g" {} \;

      - name: Create environment tfvars in each template directory
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
          CODER_ACCESS_URL: ${{ vars.CODER_ACCESS_URL }}
        run: |
          echo "Creating terraform.auto.tfvars with environment and coder_url in each template"
          for template_dir in templates/*/; do
            if [ -f "${template_dir}main.tf" ]; then
              cat > "${template_dir}terraform.auto.tfvars" <<EOF
          environment = "${ENVIRONMENT}"
          coder_url   = "${CODER_ACCESS_URL}"
          EOF
              echo "Created tfvars in ${template_dir}"
            fi
          done

      - name: Initialize Terraform
        working-directory: ./templates
        run: terraform init

      - name: Create tfvars file
        working-directory: ./templates
        env:
          CODER_ACCESS_URL: ${{ vars.CODER_ACCESS_URL }}
          CODER_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
          TEMPLATE_NAME: ${{ github.event.inputs.template_name || '' }}
          COMMIT_SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          cat > terraform.auto.tfvars <<EOF
          coder_url = "${CODER_ACCESS_URL}"
          coder_token = "${CODER_TOKEN}"
          environment = "${ENVIRONMENT}"
          template_name = "${TEMPLATE_NAME}"
          commit_sha = "${COMMIT_SHA}"
          EOF

      - name: Import existing templates
        working-directory: ./templates
        run: |
          # Import terraform state for templates that already exist
          # This prevents "already exists" errors by recognizing existing templates
          # Template names are extracted from templates-config.tf so new templates
          # are picked up automatically without editing this workflow.
          grep '= merge({' templates-config.tf | sed 's/.*"\([^"]*\)".*/\1/' | while read -r name; do
            echo "Importing template: ${name}"
            terraform import "coderd_template.templates[\"${name}\"]" "coder/${name}" || true
          done

      - name: Validate Terraform configuration
        working-directory: ./templates
        run: terraform validate

      - name: Plan Terraform deployment
        working-directory: ./templates
        run: terraform plan -out=tfplan

      - name: Apply Terraform deployment
        working-directory: ./templates
        # Limit parallelism to avoid the Coder file-upload rate limit
        # (HTTP 429: max 12 requests/min). The default parallelism of 10
        # uploads every template directory concurrently and trips it.
        run: terraform apply -auto-approve -parallelism=2 tfplan

      - name: Show deployment summary
        working-directory: ./templates
        if: always()
        run: terraform output -json deployed_templates

      - name: Clean up sensitive files
        working-directory: ./templates
        if: always()
        env:
          GH_BOT_TOKEN: ${{ secrets.ABRIDGE_GH_BOT }}
        run: |
          rm -f terraform.auto.tfvars
          rm -f terraform.tfstate*
          # tfplan stores the variable values, coder_token included
          rm -f tfplan
          # Clean up template-specific tfvars files
          find . -maxdepth 2 -name "terraform.auto.tfvars" -delete
          # ~/.gitconfig outlives the job on a self-hosted runner
          git config --global --unset-all "url.https://${GH_BOT_TOKEN}@github.com/.insteadOf" || true
