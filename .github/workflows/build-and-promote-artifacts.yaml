name: Build and Promote Artifacts

on:
  # Build on PR
  pull_request:
    branches:
      - main
      - taruj/custom-images-for-templates
    paths:
      - "docker/**"
      - ".github/workflows/build-and-promote-artifacts.yaml"

  # Promote on workflow_dispatch with PR number
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to promote artifacts from'
        required: true
        type: string
      promote:
        description: 'Promote images to latest'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  detect-changed-images:
    # Run on PR or manual trigger
    if: github.event_name == 'pull_request' || github.event.inputs.promote == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # When triggered manually for promotion, checkout the PR that was specified
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', github.event.inputs.pr_number) || '' }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: docker/**

      - name: Set matrix for changed images
        id: set-matrix
        run: |
          echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"

          declare -a IMAGES=()

          while IFS= read -r file; do
            if [[ "$file" == docker/*/Dockerfile ]]; then
              IMAGE_NAME=$(basename "$(dirname "$file")")
              CONTEXT_PATH=$(dirname "$file")
              IMAGES+=("{\"name\":\"$IMAGE_NAME\",\"dockerfile\":\"$file\",\"context\":\"$CONTEXT_PATH\"}")
            fi
          done <<< "${{ steps.changed-files.outputs.all_changed_files }}"

          # If no specific Dockerfiles changed but docker directory was modified, build all
          if [ ${#IMAGES[@]} -eq 0 ] && grep -q '^docker/' <<< "${{ steps.changed-files.outputs.all_changed_files }}"; then
            for file in docker/*/Dockerfile; do
              if [[ -f "$file" ]]; then
                IMAGE_NAME=$(basename "$(dirname "$file")")
                CONTEXT_PATH=$(dirname "$file")
                IMAGES+=("{\"name\":\"$IMAGE_NAME\",\"dockerfile\":\"$file\",\"context\":\"$CONTEXT_PATH\"}")
              fi
            done
          fi

          # Handle the old format for backward compatibility
          while IFS= read -r file; do
            if [[ "$file" == docker/*.Dockerfile ]]; then
              IMAGE_NAME=$(basename "$file" .Dockerfile)
              IMAGES+=("{\"name\":\"$IMAGE_NAME\",\"dockerfile\":\"$file\",\"context\":\".\"}")
            fi
          done <<< "${{ steps.changed-files.outputs.all_changed_files }}"

          # Create matrix JSON
          MATRIX="{\"image\":[$(IFS=,; echo "${IMAGES[*]}")]}"
          echo "matrix=$MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect-changed-images
    # Only run on pull_request event
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}
    env:
      REGISTRY: us-central1-docker.pkg.dev
      REPO: ${{ vars.DOCKER_REPOSITORY }}
      SHORT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Set Short SHA
        run: echo "SHORT_SHA=${SHORT_SHA:0:7}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_ARTIFACT_REGISTRY }}
          service_account: ${{ vars.GCP_SA_EMAIL_ARTIFACT_REGISTRY }}
          token_format: "access_token"
          access_token_lifetime: "900s"

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.image.name }}:${{ env.SHORT_SHA }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.image.name }}:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.image.name }}:latest,mode=max

  promote-artifacts:
    needs: detect-changed-images
    # Run on workflow_dispatch with promote=true, or if PR was merged
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.promote == 'true') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}
    env:
      REGISTRY: us-central1-docker.pkg.dev
      REPO: ${{ vars.DOCKER_REPOSITORY }}
      # Use PR SHA from event or provided PR number based on trigger
      SHORT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.inputs.pr_number && format('refs/pull/{0}/merge', github.event.inputs.pr_number) }}
    steps:
      - name: Set SHA Source
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
            PR_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                        "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")
            echo "SHORT_SHA=$(echo $PR_DATA | jq -r '.head.sha' | cut -c1-7)" >> $GITHUB_ENV
          else
            echo "SHORT_SHA=${SHORT_SHA:0:7}" >> $GITHUB_ENV
          fi

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_ARTIFACT_REGISTRY }}
          service_account: ${{ vars.GCP_SA_EMAIL_ARTIFACT_REGISTRY }}
          token_format: "access_token"
          access_token_lifetime: "600s"

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Promote images
        run: |
          echo "Promoting image ${{ matrix.image.name }} from tag ${{ env.SHORT_SHA }} to latest"
          gcloud container images add-tag ${REGISTRY}/${REPO}/${{ matrix.image.name }}:${SHORT_SHA} ${REGISTRY}/${REPO}/${{ matrix.image.name }}:latest --quiet
