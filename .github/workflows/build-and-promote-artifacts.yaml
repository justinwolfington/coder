name: Build and Promote Artifacts

on:
  # Build on PR and commits to PR
  pull_request:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/build-and-promote-artifacts.yaml"
    types: [opened, synchronize, reopened]

  # Build on push to PR branches
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/build-and-promote-artifacts.yaml"

  # Promote on workflow_dispatch with PR number
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to promote artifacts from'
        required: true
        type: string
      promote:
        description: 'Promote images to latest'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detect-changed-images:
    # Run on PR, push, or manual trigger
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event.inputs.promote == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # When triggered manually for promotion, checkout the PR that was specified
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', github.event.inputs.pr_number) || '' }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: docker/**
          # When manually triggered, compare against main branch
          base_sha: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}

      - name: Set matrix for changed images
        id: set-matrix
        env:
          FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          echo "Changed files:"
          echo "$FILES"

          declare -a IMAGES=()
          declare -A SEEN=()

          add_image() {
            local name="$1" dockerfile="docker/$1.Dockerfile"
            [ -f "$dockerfile" ] || return 0
            [ -n "${SEEN[$name]:-}" ] && return 0
            SEEN[$name]=1
            IMAGES+=("{\"name\":\"$name\",\"dockerfile\":\"$dockerfile\",\"context\":\".\"}")
            echo "Added changed image: $name"
          }

          # Rebuild on changes to a Dockerfile or to its build-context
          # directory (docker/<name>/**), not all Dockerfiles
          for file in $FILES; do
            if [[ "$file" == docker/*.Dockerfile ]]; then
              add_image "$(basename "$file" .Dockerfile)"
            elif [[ "$file" == docker/*/* ]]; then
              f="${file#docker/}"
              add_image "${f%%/*}"
            fi
          done

          MATRIX="{\"image\":[$(IFS=,; echo "${IMAGES[*]}")]}"
          echo "Final matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect-changed-images
    # Run on pull_request or push event
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}
    env:
      REGISTRY: us-central1-docker.pkg.dev
      PROJECT: abridge-artifact-registry
      REPO: coder
      SHORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Set Short SHA
        run: echo "SHORT_SHA=${SHORT_SHA:0:7}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_ARTIFACT_REGISTRY }}
          service_account: ${{ vars.GCP_SA_EMAIL_ARTIFACT_REGISTRY }}
          token_format: "access_token"
          access_token_lifetime: "900s"

      - name: Login to GAR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Chainguard base images are pulled through the GAR cgr remote proxy
      # (us multi-region), which needs its own registry login.
      - name: Login to GAR (us multi-region)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/${{ matrix.image.name }}:${{ env.SHORT_SHA }}

  promote-artifacts:
    needs: [detect-changed-images, build-and-push]
    # Run when code is pushed to main branch (includes merged PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}
    env:
      REGISTRY: us-central1-docker.pkg.dev
      PROJECT: abridge-artifact-registry
      REPO: coder
      # SHORT_SHA is set by the "Set SHA for push to main" step
    steps:
      - name: Set SHA for push to main
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "Event: ${EVENT_NAME}, Ref: ${REF}"
          if [[ -z "$HEAD_SHA" ]]; then
            echo "Error: github.sha was empty for this push event."
            exit 1
          fi
          echo "Push SHA: $HEAD_SHA"
          echo "SHORT_SHA=${HEAD_SHA:0:7}" >> $GITHUB_ENV
          echo "Successfully set SHORT_SHA to ${HEAD_SHA:0:7}"

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_ARTIFACT_REGISTRY }}
          service_account: ${{ vars.GCP_SA_EMAIL_ARTIFACT_REGISTRY }}
          token_format: "access_token"
          access_token_lifetime: "600s"

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Promote images
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          if [[ -z "$SHORT_SHA" ]]; then
            echo "Error: SHORT_SHA is empty. Cannot promote."
            exit 1
          fi

          SOURCE_TAG="${REGISTRY}/${PROJECT}/${REPO}/${IMAGE_NAME}:${SHORT_SHA}"
          TARGET_TAG="${REGISTRY}/${PROJECT}/${REPO}/${IMAGE_NAME}:latest"

          echo "Checking if image exists: $SOURCE_TAG"
          if gcloud container images describe "$SOURCE_TAG" >/dev/null 2>&1; then
            echo "Promoting image ${IMAGE_NAME} from tag ${SHORT_SHA} to latest"
            gcloud container images add-tag "$SOURCE_TAG" "$TARGET_TAG" --quiet
            echo "Successfully promoted ${IMAGE_NAME}"
          else
            echo "Warning: Image $SOURCE_TAG does not exist. Skipping promotion."
            echo "This may happen if no changes were made to this Docker image in the current push."
          fi
