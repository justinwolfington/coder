name: Create Version Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g., v1.1.0)'
        required: true
        type: string

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create and push tag
        id: create-tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          VERSION="${{ github.event.inputs.version }}"

          # Check if tag already exists on remote
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            echo "Tag $VERSION already exists. Skipping creation."
            echo "tag_created=false" >> $GITHUB_OUTPUT
          else
            # Create and push the tag
            git tag $VERSION
            git push origin $VERSION
            echo "Created and pushed tag: $VERSION"
            echo "tag_created=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.create-tag.outputs.tag_created == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## Module Version ${{ github.event.inputs.version }}

            This tag provides a stable reference for Terraform modules.
            Use this tag in your module references: `?ref=${{ github.event.inputs.version }}`
          draft: false
          prerelease: false
