name: Promote artifacts

on:
  pull_request:
    types: [closed]  # Only run when PR is merged
    # Only run on specific branches
    branches:
      - main
      - taruj/custom-images-for-templates
    # Must match paths from build-artifacts.yml
    paths:
      - "docker/**"  # Dockerfile changes
      - ".github/workflows/build-artifacts.yml"  # workflow changes

permissions:
  contents: read
  id-token: write

jobs:
  detect-changed-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            docker/**

      - name: Set matrix for changed images
        id: set-matrix
        run: |
          # Get list of changed Dockerfiles
          CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          IMAGES=()

          # Check each Dockerfile in the docker directory
          for file in $CHANGED_FILES; do
            if [[ $file == docker/*.Dockerfile ]]; then
              # Extract image name from filename (e.g., docker/base.Dockerfile -> base)
              IMAGE_NAME=$(basename "$file" .Dockerfile)
              IMAGES+=("{\"name\":\"$IMAGE_NAME\"}")
            fi
          done

          # If no specific Dockerfiles changed but docker directory was modified, promote all
          if [ ${#IMAGES[@]} -eq 0 ] && [[ "$CHANGED_FILES" == *"docker/"* ]]; then
            for file in docker/*.Dockerfile; do
              IMAGE_NAME=$(basename "$file" .Dockerfile)
              IMAGES+=("{\"name\":\"$IMAGE_NAME\"}")
            done
          fi

          # Create matrix JSON
          MATRIX="{\"image\":[$(IFS=,; echo "${IMAGES[*]}")]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  promote-artifacts:
    needs:
      - detect-changed-images
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}
    steps:
      - name: Download prerelease file
        uses: dawidd6/action-download-artifact@v6
        with:
          name: prerelease-${{ github.event.number }}
          github_token: ${{ secrets.ABRIDGE_GH_BOT }}
          workflow: build-artifacts.yml
          pr: ${{ github.event.number }}

      - name: Extract prerelease version
        run: |
          PRERELEASE_VERSION=$(cat prerelease.txt)
          echo "PRERELEASE_VERSION=${PRERELEASE_VERSION}" >> "${GITHUB_ENV}"

      - name: Extract release version
        run: |
          RELEASE_VERSION=$(echo ${PRERELEASE_VERSION} | cut -d '-' -f 1)
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_ARTIFACT_REGISTRY }}
          service_account: ${{ vars.GCP_SA_EMAIL_ARTIFACT_REGISTRY }}
          token_format: "access_token"
          access_token_lifetime: "600s"

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Promote images
        env:
          DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
        run: |
          gcloud container images add-tag ${DOCKER_REPOSITORY}/${{ matrix.image.name }}:${PRERELEASE_VERSION} ${DOCKER_REPOSITORY}/${{ matrix.image.name }}:${RELEASE_VERSION} --quiet
