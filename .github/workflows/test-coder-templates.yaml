name: Test Coder Templates

on:
  pull_request:

  # Run in merge queue
  # Before merging a PR, test all templates in dev environment
  merge_group:
    types: [checks_requested]

  # Run on push to specific test branch and main
  push:
    branches:
      - main
    paths:
      - "templates/**"
      - "tests/test_templates.sh"
      - "tests/templates/**"
      - ".github/workflows/test-coder-templates.yaml"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      template_name:
        description: 'Specific template name to test (optional, tests all if empty)'
        required: false
        type: string
      environment:
        description: 'Environment to test against (development, staging, production)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  actions: read
  pull-requests: write  # For PR comments
  issues: write  # For PR comments

jobs:
  # Determine which templates to test based on changed files
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      should_test: ${{ steps.matrix.outputs.should_test }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            templates/**
            modules/**
            tests/**
            .github/workflows/test-coder-templates.yaml
          since_last_remote_commit: true

      - name: Build matrix
        id: matrix
        env:
          TEMPLATE_NAME: ${{ inputs.template_name }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          # Determine which templates to test
          if [[ -n "$TEMPLATE_NAME" ]]; then
            templates="$TEMPLATE_NAME"
          elif [[ "$REF_NAME" == "main" ]] || \
               [[ "$EVENT_NAME" == "workflow_dispatch" ]] || \
               [[ "$ANY_CHANGED" == "true" && ( "$CHANGED_FILES" == *"modules/"* || "$CHANGED_FILES" == *"tests/"* || "$CHANGED_FILES" == *".github/"* ) ]]; then
            # Test all templates
            templates=$(ls tests/templates/*.json | xargs -n1 basename -s .json | tr '\n' ' ')
          else
            # Test only changed templates
            templates=""
            read -ra changed_files <<< "$CHANGED_FILES"
            for file in "${changed_files[@]}"; do
              if [[ $file == templates/* ]]; then
                template=$(echo "$file" | cut -d'/' -f2)
                [[ -f "tests/templates/${template}.json" ]] && templates="$templates $template"
              fi
            done
          fi

          # GPU scenarios each hold real accelerators for the length of the run and
          # have produced no passing result in months, so they are opt-in: only a
          # manual dispatch schedules them.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            scenario_query='keys[]'
          else
            scenario_query='to_entries[] | select(.value.gpu != true) | .key'
          fi

          # Build JSON matrix
          matrix="["
          for template in $templates; do
            [[ ! -f "tests/templates/${template}.json" ]] && continue
            for scenario in $(jq -r "$scenario_query" "tests/templates/${template}.json"); do
              [[ "$matrix" != "[" ]] && matrix+=","
              matrix+="{\"template\":\"$template\",\"scenario\":\"$scenario\"}"
            done
          done
          matrix+="]"

          # Output results
          if [[ "$matrix" == "[]" ]]; then
            echo "should_test=false" >> $GITHUB_OUTPUT
            echo "result=[]" >> $GITHUB_OUTPUT
          else
            echo "should_test=true" >> $GITHUB_OUTPUT
            echo "result=$matrix" >> $GITHUB_OUTPUT
            echo "Testing: $templates"
          fi

  test-templates:
    needs: detect-changes
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.should_test == 'true'
    runs-on: abridge-runner-${{ inputs.environment || 'development' }}
    environment: ${{ inputs.environment || 'development' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Coder CLI
        uses: coder/setup-action@4a607a8113d4e676e2d7c34caa20a814bc88bfda # v1
        with:
          access_url: ${{ vars.CODER_ACCESS_URL }}
          coder_session_token: ${{ secrets.CODER_SESSION_TOKEN }}

      - name: Run test
        env:
          CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
          CODER_ACCESS_URL: ${{ vars.CODER_ACCESS_URL }}
          TEMPLATE: ${{ matrix.template }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          chmod +x ./tests/test_templates.sh
          ./tests/test_templates.sh "tests/templates/${TEMPLATE}.json" "$SCENARIO"

  summary:
    needs: test-templates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate test summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const tests = jobs.jobs.filter(job => job.name.startsWith('test-templates'));
            const passed = tests.filter(job => job.conclusion === 'success').length;
            const failed = tests.filter(job => job.conclusion === 'failure');

            console.log(`${passed}/${tests.length} tests passed ${failed.length ? '❌' : '✅'}`);
            await core.summary.addRaw(`## Tests: ${passed}/${tests.length} passed ${failed.length ? '❌' : '✅'}`).write();

            if (failed.length) core.setFailed(`${failed.length} tests failed`);
