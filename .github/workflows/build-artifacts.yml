name: Build artifacts

on:
  pull_request:
    # Only run on specific branches
    branches:
      - main
      - taruj/custom-images-for-templates
    # Only trigger on changes to Docker files or workflow itself
    paths:
      - "docker/**"  # Dockerfile changes
      - ".github/workflows/build-artifacts.yml"  # workflow changes

permissions:
  contents: read
  id-token: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha}}
    outputs:
      PRERELEASE_VERSION: ${{ env.PRERELEASE_VERSION }}
      RELEASE_VERSION: ${{ env.HEAD_VERSION }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract base version from package.json on main
        run: |
          BASE_VERSION=$(jq -r '.version' package.json)
          echo "BASE_VERSION=${BASE_VERSION}" >> "${GITHUB_ENV}"

      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Extract head version from package.json on head branch
        run: |
          HEAD_VERSION=$(jq -r '.version' package.json)
          echo "HEAD_VERSION=${HEAD_VERSION}" >> "${GITHUB_ENV}"

      - name: Compare versions
        run: |
          if [[ $(printf "%s\n%s" "${BASE_VERSION}" "${HEAD_VERSION}" | sort -V | head -n 1) == "${BASE_VERSION}" && "${BASE_VERSION}" != "${HEAD_VERSION}" ]]; then
            echo "HEAD_VERSION=${HEAD_VERSION} is greater than BASE_VERSION=${BASE_VERSION}"
          else
            echo "HEAD_VERSION=${HEAD_VERSION} is not greater than BASE_VERSION=${BASE_VERSION}"
            exit 1
          fi

      - name: Determine pre-release version
        run: echo "PRERELEASE_VERSION=${HEAD_VERSION}-${HEAD_SHA::7}" >> "${GITHUB_ENV}"

  detect-changed-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            docker/**

      - name: Set matrix for changed images
        id: set-matrix
        run: |
          # Get list of changed Dockerfiles
          CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          IMAGES=()

          # Check each Dockerfile in the docker directory
          for file in $CHANGED_FILES; do
            if [[ $file == docker/*.Dockerfile ]]; then
              # Extract image name from filename (e.g., docker/base.Dockerfile -> base)
              IMAGE_NAME=$(basename "$file" .Dockerfile)
              IMAGES+=("{\"name\":\"$IMAGE_NAME\",\"dockerfile\":\"$file\"}")
            fi
          done

          # If no specific Dockerfiles changed but docker directory was modified, build all
          if [ ${#IMAGES[@]} -eq 0 ] && [[ "$CHANGED_FILES" == *"docker/"* ]]; then
            for file in docker/*.Dockerfile; do
              IMAGE_NAME=$(basename "$file" .Dockerfile)
              IMAGES+=("{\"name\":\"$IMAGE_NAME\",\"dockerfile\":\"$file\"}")
            done
          fi

          # Create matrix JSON
          MATRIX="{\"image\":[$(IFS=,; echo "${IMAGES[*]}")]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-push-docker-images:
    needs:
      - check-versions
      - detect-changed-images
    env:
      PRERELEASE_VERSION: ${{ needs.check-versions.outputs.PRERELEASE_VERSION }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_ARTIFACT_REGISTRY }}
          service_account: ${{ vars.GCP_SA_EMAIL_ARTIFACT_REGISTRY }}
          token_format: "access_token"
          access_token_lifetime: "900s"

      - name: Login to GAR for Docker
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ vars.DOCKER_REPOSITORY }}/${{ matrix.image.name }}:${{ env.PRERELEASE_VERSION }}
          cache-from: type=registry,ref=${{ vars.DOCKER_REPOSITORY }}/${{ matrix.image.name }}:latest
          cache-to: type=registry,ref=${{ vars.DOCKER_REPOSITORY }}/${{ matrix.image.name }}:latest,mode=max

  save-prerelease:
    needs:
      - check-versions
      - build-push-docker-images
    env:
      PRERELEASE_VERSION: ${{ needs.check-versions.outputs.PRERELEASE_VERSION }}
      RELEASE_VERSION: ${{ needs.check-versions.outputs.RELEASE_VERSION }}
    runs-on: ubuntu-latest
    steps:
      - name: Save prerelease to file
        run: echo "${PRERELEASE_VERSION}" > prerelease.txt
      - name: Upload prerelease file as Github Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-${{ github.event.number }}
          path: prerelease.txt
