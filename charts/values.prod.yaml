# Production-specific overrides
---
coder:
  # coder.httpRoute -- The HTTPRoute object to expose for Coder.
  httpRoute:
    hostname: coder.abridge.services

  coder:
    image:
      repo: us-central1-docker.pkg.dev/abridge-artifact-registry/coder/coder-server@sha256
      tag: b8990953e425f26e3c5417c4a6eb9f7586115f82287bf0f1b022147e9e3f682a

    # Production-specific configuration
    env:
      - name: DB_USER
        value: coder-app@abridge-client-prod.iam

      - name: DB_NAME
        value: coder

      - name: CODER_PG_CONNECTION_URL
        value: "postgres://$(DB_USER)@localhost:5432/$(DB_NAME)?sslmode=disable"

      # Required: external URL for login/workspace links (e.g. https://coder.abridge.services)
      - name: CODER_ACCESS_URL
        value: https://coder.abridge.services

      # Restrict to specific GitHub org(s)
      - name: CODER_OAUTH2_GITHUB_ALLOWED_ORGS
        value: "abridgeai"

      # Allow signups (if you want users to be able to self-serve)
      - name: CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS
        value: "true"

      # Restrict to specific GitHub teams
      - name: CODER_OAUTH2_GITHUB_ALLOWED_TEAMS
        value: "abridgeai/coder-production"

      # Allow Tailscale P2P direct connections between client and workspace agent.
      # Falls back to DERP relay automatically if P2P fails. End-to-end Wireguard
      # encryption applies in both modes.
      - name: CODER_BLOCK_DIRECT
        value: "false"

      - name: CODER_DERP_FORCE_WEBSOCKETS
        value: "true"

      # Disable telemetry for the coder server
      - name: CODER_TELEMETRY_ENABLE
        value: "false"

      - name: CODER_EXTERNAL_AUTH_0_ID
        value: primary-github

      - name: CODER_EXTERNAL_AUTH_0_TYPE
        value: github

      - name: CODER_EXTERNAL_AUTH_0_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: coder-github-app
            key: CODER_OAUTH2_GITHUB_CLIENT_ID

      - name: CODER_EXTERNAL_AUTH_0_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: coder-github-app
            key: CODER_OAUTH2_GITHUB_CLIENT_SECRET

      - name: CODER_OAUTH2_GITHUB_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: coder-github-app
            key: CODER_OAUTH2_GITHUB_CLIENT_ID

      - name: CODER_OAUTH2_GITHUB_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: coder-github-app
            key: CODER_OAUTH2_GITHUB_CLIENT_SECRET

      # Okta OIDC. Uses the org authorization server (issuer has no path
      # suffix): abridge.okta.com has no API Access Management licence, so
      # the /oauth2/default custom server returns E0000015.
      - name: CODER_OIDC_ISSUER_URL
        value: https://abridge.okta.com

      - name: CODER_OIDC_EMAIL_DOMAIN
        value: abridge.com

      - name: CODER_OIDC_SIGN_IN_TEXT
        value: Sign in with Okta

      - name: CODER_OIDC_ICON_URL
        value: /icon/okta.svg

      - name: CODER_OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: coder-okta-oidc-app
            key: CODER_OIDC_CLIENT_ID

      - name: CODER_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: coder-okta-oidc-app
            key: CODER_OIDC_CLIENT_SECRET

      - name: CODER_OIDC_SCOPES
        value: openid,profile,email,groups

      - name: CODER_OIDC_GROUP_FIELD
        value: groups

      - name: CODER_OIDC_GROUP_REGEX_FILTER
        value: "^coder-.*$"

      - name: CODER_OIDC_GROUP_AUTO_CREATE
        value: "true"

      # Coder by default writes audit logs to /dev/stderr
      - name: CODER_LOGGING_HUMAN
        value: /dev/stdout

      # only store audit logs
      - name: CODER_LOG_FILTER
        value: ".*coderd: audit_log.*"

      - name: TF_VAR_environment
        value: production

      - name: TF_VAR_judges_openai_base_url
        value: "https://llm-gateway-evals.abridge.services/v1"

      # PHI workspaces reach LangSmith only through the Teleport-authorized
      # broker proxy; they never receive a key directly.
      - name: TF_VAR_langsmith_endpoint
        value: "http://langsmith-proxy.coder.svc.cluster.local:8080/api/v1"

      - name: TF_VAR_langsmith_annotation_endpoint
        value: "http://langsmith-annotation-proxy.coder.svc.cluster.local:8080/api/v1"

      # Dedicated bucket-only identity for UTD-enabled PHI workspaces; the
      # LangSmith proxy rejects the shared coder identity.
      - name: TF_VAR_phi_workspace_utd_service_account
        value: coder-phi-workspace-utd

    # mount the git secrets to enable coder to pull modules from coder repo
    # the following secrets have read only access to the coder repo
    volumes:
      - name: git-secrets
        secret:
          secretName: coder-github-app
          items:
            - key: .gitconfig
              path: .gitconfig
            - key: .git-credentials
              path: .git-credentials
    volumeMounts:
      - name: git-secrets
        mountPath: "/home/coder/.gitconfig"
        subPath: .gitconfig
        readOnly: true
      - name: git-secrets
        mountPath: "/home/coder/.git-credentials"
        subPath: .git-credentials
        readOnly: true

    # coder.service -- The Service object to expose for Coder.
    service:
      # coder.service.type -- Set to ClusterIP when using Ingress.
      type: ClusterIP

    # Pod annotations to disable Istio injection for Coder server
    podAnnotations:
      sidecar.istio.io/inject: "false"

    # Production-specific service account
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: "coder-app@abridge-client-prod.iam.gserviceaccount.com"

    # coder.initContainers -- Init containers for the deployment.
    # Cloud SQL Auth Proxy for connecting to PostgreSQL
    # See: https://cloud.google.com/sql/docs/mysql/connect-kubernetes-engine#proxy
    initContainers:
      - name: cloud-sql-proxy
        restartPolicy: Always
        # It is recommended to use the latest version of the Cloud SQL Auth Proxy!
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy@sha256:fa4c7308245407157c5e9c4e16f1c0f1113899d6f29dc8f8be3e30efae86467f # 2.22.0
        args:
          # Connect over private IP in VPC-native GKE cluster
          - --private-ip

          # Use Automatic IAM authentication
          - --auto-iam-authn

          # Enable structured logging
          - --structured-logs

          # PostgreSQL port configuration
          - --port=5432
          - abridge-client-prod:us-central1:coder-postgres-db
        securityContext:
          # The default Cloud SQL Auth Proxy image runs as the
          # "nonroot" user and group (uid: 65532) by default.
          runAsNonRoot: true
        # Resource allocation to prevent overutilization
        resources:
          requests:
            # Memory scales with connection count
            memory: 1Gi
            # CPU scales with database I/O
            cpu: 100m

    # coder.ingress -- The Ingress object to expose for Coder.
    ingress:
      enable: false

coderUserDataTransfer:
  enabled: true
  environment: prod
  operationID: prodsec-1148-prod-01-plan
  operation: transfer
  mode: plan
  image:
    digest: sha256:1eb96496bb171994366838c78b18f9d2582743837e47867bd15e8c10a002112f
  sourceUserID: "db08c2e2-311d-44b1-a404-30c3835bf119"
  targetUserID: "38d5d0a2-95de-4f52-8c7a-bedc2a85b11e"
  database:
    user: coder-app@abridge-client-prod.iam
    instanceConnectionName: abridge-client-prod:us-central1:coder-postgres-db

# Production-specific network policy configuration
networkPolicy:
  # Last environment to flip; dev then staging first.
  enforce: false

  internalCIDRs:
    - 172.32.0.0/12
    - 172.48.0.0/22
  nodeCIDR: "10.6.0.0/16"

  # Unknown: read the us-central1 proxy-only subnet off the VPC and add it
  # alongside the GCP health check ranges 35.191.0.0/16 and 130.211.0.0/22.
  gatewayCIDRs: []

  databaseCIDR: "10.6.0.104/32"

  allowedServices:
    - name: eyes
      port: 8000
      namespace: eyes-v1
      selector:
        app.kubernetes.io/name: eyes-new
        app.kubernetes.io/instance: eyes-v1
    - name: llm-gateway-evals
      port: 80
      namespace: llm-gateway
      selector:
        app: llm-gateway-evals
        component: gateway-service

  # Additional egress rules for general internet access
  additionalEgressRules:
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 172.32.0.0/12
              - 172.48.0.0/22
              - 10.6.0.0/16
    # Allow UDP/19302 egress for STUN endpoint discovery (Tailscale P2P NAT
    # traversal). Required before CODER_BLOCK_DIRECT can be flipped to false
    # in production. Internal CIDRs excepted to keep PHI traffic off the
    # internet path.
    - ports:
        - port: 19302
          protocol: UDP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 172.32.0.0/12
              - 172.48.0.0/22
              - 10.6.0.0/16

# Shared identities for legacy PHI workspaces and the UTD bucket mount. The
# UTD identity has only the bucket-level IAM granted in infrastructure; normal
# PHI workspaces continue to receive unique, non-GCP ServiceAccounts.
phiWorkspaceServiceAccounts:
  enabled: true
  utdGcpServiceAccount: "coder-phi-workspace-utd@abridge-client-prod.iam.gserviceaccount.com"

# PRODSEC-580: Coder-side identity proxy for the LangSmith credential broker.
# Enabled for prod-live: PHI workspaces reach LangSmith only through this proxy
# (see TF_VAR_langsmith_endpoint above), authenticating to the broker with the
# dedicated coder-langsmith-proxy Workload Identity.
langsmithProxy:
  enabled: true
  networkPolicy:
    nodeCIDR: "10.6.0.0/16"
  image:
    digest: "sha256:2d11c4180671737f51710d442e49a41c4ac5fcc777a1d514b8cb91a20419cc59" # 6141531
  upstreamUrl: https://langsmith-live.abridge.services/coder-broker
  brokerAudience: https://langsmith-live.abridge.services/coder-broker
  serviceAccount:
    gcpServiceAccount: coder-langsmith-proxy@abridge-client-prod.iam.gserviceaccount.com


langsmithAnnotationProxy:
  enabled: true
  networkPolicy:
    nodeCIDR: "10.6.0.0/16"
  image:
    digest: "sha256:2d11c4180671737f51710d442e49a41c4ac5fcc777a1d514b8cb91a20419cc59" # 6141531
  upstreamUrl: https://langsmith-live.abridge.services/annotation-broker
  brokerAudience: https://langsmith-live.abridge.services/annotation-broker
  serviceAccount:
    gcpServiceAccount: coder-annotation-proxy@abridge-client-prod.iam.gserviceaccount.com
# Enable PHI Istio egress controls in production
phiIstio:
  enabled: true
  allowedHosts:
    # Coder server - workspace agents need to connect to this
    - coder.abridge.services
    # Secret Manager - allow JIT-granted roles/secretmanager.secretAccessor
    # to fetch approved secrets (e.g. ehr_interop_api_key) from inside the
    # Prod PHI workspace instead of copying them in from outside.
    - secretmanager.googleapis.com
    - llm-gateway-evals.abridge.services
  allowedHttpHosts:
    - deid.abridge.services
    - encounter-processor-api.abridge.services
    # ehr-interop API - allow PriorNoteFetcher and other ehr-interop calls
    # from inside the Prod PHI workspace using an x-api-key fetched via
    # Secret Manager.
    - ehr-interop-nestjs-api.abridge.services
    # SECPRIV-13188: bilrost nursing - allow the nursing flowsheet playground to be called
    # from inside the Prod PHI workspace for workflow-fix generation/eval
    # harnesses.
    - bilrost-nursing.abridge.services

# Enable Kubernetes event streaming for production environment
coder-logstream-kube:
  enabled: true
  url: https://coder.abridge.services # Must match CODER_ACCESS_URL above
  # Digest-pinned via the repo@sha256 + tag split the subchart's template
  # concatenates, same idiom as coder.image above.
  image:
    repo: ghcr.io/coder/coder-logstream-kube@sha256
    tag: 10ae596d296e420789a812c2ed5731218d650cadff1073f8ab69cbbebe0c977d # v0.0.15

# Okta OIDC login for the coder.abridge.services deployment
oidcAuth:
  enabled: true
