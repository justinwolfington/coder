# Based on: https://github.com/coder/coder/blob/v2.20.3/helm/coder/values.yaml
---
coder:
  coder:
    # coder.env -- The environment variables to set for Coder.
    # These configure all aspects of `coder server` and are passed to
    # workspace provisioners. See `coder server --help` for supported variables.
    #
    # Note: Do not set the following—these are managed automatically:
    # - CODER_HTTP_ADDRESS
    # - CODER_TLS_ENABLE / CODER_TLS_CERT_FILE / CODER_TLS_KEY_FILE
    env:
      - name: TEST
        value: test

      - name: DB_USER
        value: postgres

      - name: DB_NAME
        value: coder

      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: coder-db-password
            key: DB_PASSWORD

      - name: CODER_PG_CONNECTION_URL
        value: >-
          postgres://$(DB_USER):$(DB_PASSWORD)@localhost:5432/$(DB_NAME)?sslmode=disable

      # For production deployments, we recommend configuring your own GitHub
      # OAuth2 provider and disabling the default one.
      - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
        value: "false"

      # Prevent direct (IP-based) access; enforce use of ingress/proxy
      - name: CODER_BLOCK_DIRECT
        value: "true"

      # Required: external URL for login/workspace links (e.g. https://coder.abridge.coffee)
      - name: CODER_ACCESS_URL
        value: http://coder.abridge.coffee


    # coder.initContainers -- Init containers for the deployment.
    # Cloud SQL Auth Proxy for connecting to PostgreSQL
    # See: https://cloud.google.com/sql/docs/mysql/connect-kubernetes-engine#proxy
    initContainers:
      - name: cloud-sql-proxy
        # It is recommended to use the latest version of the Cloud SQL Auth Proxy!
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
        args:
          # Connect over private IP in VPC-native GKE cluster
          - --private-ip

          # Use Automatic IAM authentication
          - --auto-iam-authn

          # Enable structured logging
          - --structured-logs

          # PostgreSQL port configuration
          - --port=5432
          - client-dev-e301d:us-central1:coder-postgres-db
        securityContext:
          # The default Cloud SQL Auth Proxy image runs as the
          # "nonroot" user and group (uid: 65532) by default.
          runAsNonRoot: true
        # Resource allocation to prevent overutilization
        resources:
          requests:
            # Memory scales with connection count
            memory: 2Gi
            # CPU scales with database I/O
            cpu: 0.5

    # coder.service -- The Service object to expose for Coder.
    service:
      # coder.service.type -- Set to ClusterIP when using Ingress.
      type: ClusterIP

    # coder.serviceAccount -- GCP IAM-linked service account for the Coder deployment.
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: >-
          coder-app@client-dev-e301d.iam.gserviceaccount.com

    # coder.ingress -- The Ingress object to expose for Coder.
    ingress:
      enable: true
      # coder.ingress.annotations -- The ingress annotations.
      annotations:
        kubernetes.io/ingress.regional-static-ip-name: coder-static-ip
        kubernetes.io/ingress.class: gce-internal
        networking.gke.io/load-balancer-type: Internal
        kubernetes.io/ingress.allow-http: "true"
