# Based on: https://github.com/coder/coder/blob/v2.35.4/helm/coder/values.yaml
---
coder:
  coder:
    # The autoscaler evicts coderd off shared workspace nodes; one replica blanks the NEG.
    replicaCount: 2

coderUserDataTransfer:
  enabled: false
  environment: ""
  operationID: ""
  operation: transfer
  mode: plan
  planSHA256: ""
  image:
    repository: us-central1-docker.pkg.dev/abridge-artifact-registry/coder/coder-user-data-transfer
    digest: ""
  sourceUserID: ""
  targetUserID: ""
  targetEmail: ""
  database:
    user: ""
    name: coder
    instanceConnectionName: ""
  cloudSqlProxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.22.0@sha256:fa4c7308245407157c5e9c4e16f1c0f1113899d6f29dc8f8be3e30efae86467f

# Deny-by-default network controls for the coder namespace.
#
# enforce is the single audit-to-enforce switch, set per environment. While it
# is false nothing tightens: Kubernetes has no dry-run NetworkPolicy, so the
# scoped rules simply are not rendered, and the Istio policies ship with
# istio.io/dry-run so violations are logged instead of blocked. Flip it in one
# environment at a time once the dry-run logs are clean.
networkPolicy:
  enforce: false
  allowedServices: []
  additionalEgressRules: []
  # This cluster's pod and service ranges, excepted from the broad egress
  # rules so "the internet" cannot also mean the API server or another
  # tenant's pod. Required before enforce.
  internalCIDRs: []
  # This cluster's node range, excepted alongside internalCIDRs. Separate
  # because it is the one that keeps workspaces off the kubelet, and it is not
  # always known when the pod and service ranges are. Required before enforce.
  nodeCIDR: ""
  # Sources the internal Application Load Balancer uses to reach coderd: the
  # region's proxy-only subnet plus the GCP health check ranges. Required
  # before enforce, otherwise the namespace baseline blackholes the UI.
  gatewayCIDRs: []
  # Cloud SQL private IP. Egress to it is restricted to 5432 under enforce.
  databaseCIDR: ""

# Coder logstream configuration for Kubernetes event streaming
coder-logstream-kube:
  enabled: false  # Disabled by default, enable per environment
  # Configuration will be overridden in environment-specific values files

# Shared identities retained for old template versions and UTD's bucket-only
# Workload Identity binding. New non-UTD templates create unique no-RBAC KSAs.
phiWorkspaceServiceAccounts:
  enabled: false
  utdGcpServiceAccount: ""

# Identity-aware proxy for brokered LangSmith access from PHI workspaces
# (PRODSEC-580). Resolves caller pod metadata, enforces a bounded read API,
# and authenticates to the LangSmith-side broker with Workload Identity.
langsmithProxy:
  enabled: false
  networkPolicy:
    # Default-on defense in depth scoped only to the proxy. GKE SNATs the
    # cross-node source to the node subnet before Calico evaluates ingress.
    enabled: true
    nodeCIDR: ""
  image:
    repository: us-central1-docker.pkg.dev/abridge-artifact-registry/coder/langsmith-proxy
    tag: "" # fallback for local lint only; deployed environments use digest
    digest: ""
  # upstreamUrl includes the LangSmith-side broker path prefix.
  upstreamUrl: ""
  brokerAudience: ""
  serviceAccount:
    gcpServiceAccount: ""
  routeAllowlist: []
  maxBodyBytes: ""


langsmithAnnotationProxy:
  enabled: false
  networkPolicy:
    enabled: true
    nodeCIDR: ""
  image:
    repository: us-central1-docker.pkg.dev/abridge-artifact-registry/coder/langsmith-proxy
    tag: ""
    digest: ""
  upstreamUrl: ""
  brokerAudience: ""
  serviceAccount:
    gcpServiceAccount: ""
  maxBodyBytes: "33554432"
  routeAllowlist:
    - "GET /api/v1/info/**"
    - "GET /api/v1/sessions/**"
    - "GET /api/v1/runs/**"
    - "GET /api/v1/datasets/**"
    - "GET /api/v1/examples/**"
    - "GET /api/v1/annotation-queues/**"
    - "GET /api/v1/feedback/**"
    - "GET /api/v1/feedback-configs"
    - "POST /api/v1/runs/query"
    - "POST /api/v1/datasets/search"
    - "POST /api/v1/sessions"
    - "POST /api/v1/runs"
    - "POST /api/v1/runs/batch"
    - "POST /api/v1/runs/multipart"
    - "POST /api/v1/datasets"
    - "PATCH /api/v1/datasets/*"
    - "POST /api/v1/examples"
    - "POST /api/v1/examples/bulk"
    - "PATCH /api/v1/examples/bulk"
    - "POST /api/v1/examples/upload/*"
    - "POST /api/v1/platform/datasets/*/examples"
    - "POST /api/v1/annotation-queues"
    - "PATCH /api/v1/annotation-queues/*"
    - "POST /api/v1/annotation-queues/*/runs"
    - "POST /api/v1/annotation-queues/*/runs/by-key"
    - "POST /api/v1/annotation-queues/populate"
    - "POST /api/v1/feedback"
    - "PATCH /api/v1/feedback/*"
    - "POST /api/v1/feedback-configs"
    - "PATCH /api/v1/feedback-configs"
    - "POST /api/v1/runs/delete"
    - "POST /api/v1/runs/delete/traces"
    - "POST /api/v1/annotation-queues/*/runs/delete"
    - "DELETE /api/v1/sessions/*"
    - "DELETE /api/v1/datasets/*"
    - "DELETE /api/v1/examples/*"
    - "DELETE /api/v1/feedback/*"
    - "DELETE /api/v1/feedback-configs"
    - "DELETE /api/v1/annotation-queues/*"
# Istio egress controls for PHI workspaces
phiIstio:
  enabled: false
  # Two groups, both enforced identically. The split records which hosts an
  # internal mirror could replace and which must stay reachable.
  commonAllowedHosts:
    # package mirrors (candidates for an internal mirror)
    - us-central1-python.pkg.dev
    - us-python.pkg.dev
    - pypi.org
    - files.pythonhosted.org
    - download.pytorch.org
    - download-r2.pytorch.org
    - nodejs.org
    - registry.npmjs.org
    - ai2-s2-scispacy.s3-us-west-2.amazonaws.com
    - cdn.jsdelivr.net
    - jsdelivr.com
    - unpkg.com
    - huggingface.co
    - cdn-lfs.huggingface.co
    - cdn-lfs-us-1.huggingface.co
    - dl.google.com
    - raw.githubusercontent.com
    - githubusercontent.com
    - release-assets.githubusercontent.com
    - github-cloud.githubusercontent.com   # git-lfs object downloads (alambic/media CDN)
    - downloads.claude.ai
    - releases.openai.com

    # service endpoints (required)
    # Google OAuth (for gcloud auth login)
    - accounts.google.com
    - oauth2.googleapis.com
    # google storage and other google services
    - storage.googleapis.com
    - storage.cloud.google.com
    - metadata.google.internal
    - identitytoolkit.googleapis.com
    - iamcredentials.googleapis.com
    - googleapis.com
    - firestore.googleapis.com
    - bigquery.googleapis.com
    - bigquerystorage.googleapis.com
    - cloudresourcemanager.googleapis.com
    # Istio/ASM mesh services
    - meshca.googleapis.com
    - meshconfig.googleapis.com
    # GitHub access
    - github.com
    - api.github.com
    # internal services
    - abridge.wandb.io
    # external services for datagen/annotation
    - api.openai.com
    - us.api.openai.com
    - api.anthropic.com
    - api.centaurlabs.com
    # Baseten private (PSC) inference clusters. Per-deployment hostnames vary
    # (<deployment>-prod-gcp-us-c1.<cluster>.psc.baseten.co), so these are
    # wildcards: Istio only accepts a wildcard as a whole leading label.
    - "*.gcp-us-ctr1-abr.psc.baseten.co"   # inference, us-central1
    - "*.gcp-us-e4-abr.psc.baseten.co"     # inference, us-east4
    # Claude Code CLI (installer + release downloads; runtime API uses api.anthropic.com above)
    # Auth: claude.ai = subscription login, platform.claude.com = Console-account login
    - claude.ai
    - platform.claude.com
    - chatgpt.com
    - auth.openai.com
    # NOTEGEN-354: LaunchDarkly REST API - lets the notegen team's read-only
    # Reader token inspect flags (ldcli / MCP / REST) from inside PHI
    # workspaces. Read-only, so allowed in every environment.
    - app.launchdarkly.com

  # Wildcard hosts cannot use DNS resolution, so their ServiceEntry falls back
  # to original-destination passthrough. Without addresses a workspace can
  # resolve a matching name to any IP and egress there, so this is required
  # whenever commonAllowedHosts/allowedHosts contains a wildcard.
  wildcardAddresses: []


# Admission-time policy for the coder namespace. Audit records violations in
# policy reports and PSA warnings; Enforce rejects the pod at admission.
admissionPolicies:
  mode: Audit
  podSecurityAdmission:
    enabled: true
    # Set only once the cluster AdmissionConfiguration exempts the coder
    # namespace, otherwise Enforce rejects the privileged exectrace sidecar.
    exectraceExemptionConfigured: false
