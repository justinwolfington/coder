{{- if .Values.phiWorkspaceServiceAccounts.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # Migration compatibility for previously published PHI template versions.
  # New non-UTD workspaces use a unique KSA and the LangSmith proxy rejects
  # this shared identity.
  name: coder-phi-workspace
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-phi-workspace-utd
  namespace: {{ .Release.Namespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "phiWorkspaceServiceAccounts.utdGcpServiceAccount is required" .Values.phiWorkspaceServiceAccounts.utdGcpServiceAccount | quote }}
automountServiceAccountToken: false
{{- end }}
