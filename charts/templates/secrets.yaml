---
# External secret for Coder DB password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coder-db-password
spec:
  refreshInterval: 1h  # rate SecretManager pulls GCPSM
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secret-manager  # name of the SecretStore
  target:
    name: coder-db-password  # name of the k8s Secret to be created
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD  # The key within the Kubernetes secret
      remoteRef:
        key: coder-postgres-password  # The name of the GCPSM secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coder-github-client-id
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secret-manager
  target:
    name: coder-github-client-id
    creationPolicy: Owner
  data:
    - secretKey: CODER_OAUTH2_GITHUB_CLIENT_ID
      remoteRef:
        key: coder-github-client-id
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coder-github-client-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secret-manager
  target:
    name: coder-github-client-secret
    creationPolicy: Owner
  data:
    - secretKey: CODER_OAUTH2_GITHUB_CLIENT_SECRET
      remoteRef:
        key: coder-github-client-secret
