{{- $instances := list }}
{{- if .Values.langsmithProxy.enabled }}
{{- $instances = append $instances (dict "valuesKey" "langsmithProxy" "cfg" .Values.langsmithProxy "name" "langsmith-proxy") }}
{{- end }}
{{- if and (hasKey .Values "langsmithAnnotationProxy") .Values.langsmithAnnotationProxy.enabled }}
{{- $instances = append $instances (dict "valuesKey" "langsmithAnnotationProxy" "cfg" .Values.langsmithAnnotationProxy "name" "langsmith-annotation-proxy") }}
{{- end }}
{{- range $instances }}
{{- $valuesKey := .valuesKey }}
{{- $cfg := .cfg }}
{{- $name := .name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required (printf "%s.serviceAccount.gcpServiceAccount is required" $valuesKey) $cfg.serviceAccount.gcpServiceAccount | quote }}
---
# Exact ServiceAccount lookup only: the proxy resolves the SPIFFE identity
# authenticated by Istio to Coder-owned labels for authz and audit attribution.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-serviceaccount-reader
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-serviceaccount-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-serviceaccount-reader
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        # In-mesh so workspace -> proxy traffic is mTLS'd sidecar-to-sidecar.
        # The inbound sidecar replaces XFCC from the authenticated client
        # certificate; the application validates its exact KSA metadata.
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
        traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32,169.254.169.252/32"
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          {{- if $cfg.image.digest }}
          image: "{{ $cfg.image.repository }}@{{ $cfg.image.digest }}"
          {{- else }}
          image: "{{ $cfg.image.repository }}:{{ required (printf "%s.image.tag or image.digest is required" $valuesKey) $cfg.image.tag }}"
          {{- end }}
          ports:
            - containerPort: 8080
          env:
            - name: UPSTREAM_URL
              value: {{ $cfg.upstreamUrl | quote }}
            - name: BROKER_AUDIENCE
              value: {{ required (printf "%s.brokerAudience is required" $valuesKey) $cfg.brokerAudience | quote }}
            {{- with $cfg.routeAllowlist }}
            - name: ROUTE_ALLOWLIST
              value: {{ . | toJson | quote }}
            {{- end }}
            {{- with $cfg.maxBodyBytes }}
            - name: MAX_BODY_BYTES
              value: {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
# STRICT ensures XFCC is derived from an authenticated mesh certificate.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ $name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  mtls:
    mode: STRICT
---
# Coarse mesh gate scoped only to this workload. Any authenticated caller in
# the Coder namespace may reach the application, which then requires an exact
# per-workspace PHI KSA. Managed ASM may prune source.serviceAccounts, so the
# exact identity check remains in application code as in existing S2S flows.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ $name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  action: ALLOW
  rules:
    {{- if not (and $.Values.networkPolicy ($.Values.networkPolicy.enforce | default false)) }}
    - to:
        - operation:
            paths: ["/healthz"]
    {{- end }}
    # Dropping the unauthenticated /healthz rule costs nothing: kubelet probes
    # bypass authz through rewriteAppHTTPProbers, and every other legitimate
    # caller is in-namespace and matches the rule below.
    - from:
        - source:
            namespaces: [{{ $.Release.Namespace | quote }}]
{{- if $cfg.networkPolicy.enabled }}
---
# Calico observes the source node IP after GKE SNATs cross-node pod traffic for
# this cluster's 172.32.0.0/12 pod range. This policy is still scoped only to
# the proxy; Istio mTLS and the application enforce workload identity.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ required (printf "%s.networkPolicy.nodeCIDR is required when networkPolicy is enabled" $valuesKey) $cfg.networkPolicy.nodeCIDR | quote }}
      ports:
        # Istio redirects inbound application traffic through Envoy's virtual
        # inbound listener. Depending on dataplane hook ordering, the
        # ingress policy can observe either the original service port or the
        # redirected listener port, so both must be allowed.
        - port: 8080
          protocol: TCP
        - port: 15006
          protocol: TCP
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
---
# The inbound listener is STRICT, so declaring mTLS here only removes the
# dependency on auto-mTLS endpoint metadata, which istiod does not always emit
# for a newly created service.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ $name }}
spec:
  host: {{ printf "%s.%s.svc.cluster.local" $name $.Release.Namespace | quote }}
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
{{- end }}
