{{- if .Values.networkPolicy }}
{{- if or .Values.networkPolicy.allowedServices .Values.networkPolicy.additionalEgressRules }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coder-workspace
  namespace: coder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace
  policyTypes:
    - Egress
  egress:
    {{- range .Values.networkPolicy.allowedServices }}
    - ports:
        - port: {{ .port }}
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- range $key, $value := .selector }}
              {{ $key }}: {{ $value }}
              {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.additionalEgressRules }}
    {{- range .Values.networkPolicy.additionalEgressRules }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
    - ports:
        - port: 53
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
    # Allow access to GCE/GKE metadata servers for GCS FUSE authentication
    # GKE DNATs metadata requests; allow entire link-local range (safe, never routed externally)
    - to:
        - ipBlock:
            cidr: 169.254.0.0/16
        - ipBlock:
            cidr: 100.100.100.100/32
{{- end }}
{{- end }}
