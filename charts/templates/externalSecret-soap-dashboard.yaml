{{- if and .Values.soapDashboard .Values.soapDashboard.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coder-soap-dashboard
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secret-manager
  target:
    name: coder-soap-dashboard-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        NPM_TOKEN: "{{ `{{ .NPM_TOKEN }}` }}"
        GOOGLE_APPLICATION_CREDENTIALS_JSON: "{{ `{{ .GOOGLE_APPLICATION_CREDENTIALS_JSON }}` }}"
        LAUNCH_DARKLY_SDK_KEY: "{{ `{{ .LAUNCH_DARKLY_SDK_KEY }}` }}"
  data:
    - secretKey: NPM_TOKEN
      remoteRef:
        key: coder-npm-token
    - secretKey: GOOGLE_APPLICATION_CREDENTIALS_JSON
      remoteRef:
        key: coder-soap-dashboard-google-application-credentials
    - secretKey: LAUNCH_DARKLY_SDK_KEY
      remoteRef:
        key: coder-launch-darkly-sdk-key
{{- end }}
