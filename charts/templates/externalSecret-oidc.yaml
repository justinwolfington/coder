{{- if and .Values.oidcAuth .Values.oidcAuth.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coder-okta-oidc
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secret-manager
  target:
    name: coder-okta-oidc-app
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        CODER_OIDC_CLIENT_ID: "{{ `{{ .CODER_OIDC_CLIENT_ID }}` }}"
        CODER_OIDC_CLIENT_SECRET: "{{ `{{ .CODER_OIDC_CLIENT_SECRET }}` }}"
  data:
    - secretKey: CODER_OIDC_CLIENT_ID
      remoteRef:
        key: coder-okta-oidc-client-id
    - secretKey: CODER_OIDC_CLIENT_SECRET
      remoteRef:
        key: coder-okta-oidc-client-secret
{{- end }}
