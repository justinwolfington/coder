---
# NOTEGEN-354: syncs the notegen team's read-only LaunchDarkly Reader token
# from GCP Secret Manager (coder-launch-darkly-notegen-reader-token) into a
# k8s secret consumed by PHI workspaces (see templates/phi-gpu-k8s/main.tf).
# Rendered in every environment (read-only token); the source secret must
# exist in each env's project or external-secrets reports SecretSyncError.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coder-notegen-launchdarkly
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secret-manager
  target:
    name: coder-notegen-launchdarkly-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        LAUNCHDARKLY_NOTEGEN_READONLY_ACCESS_TOKEN: "{{ `{{ .LAUNCHDARKLY_NOTEGEN_READONLY_ACCESS_TOKEN }}` }}"
  data:
    - secretKey: LAUNCHDARKLY_NOTEGEN_READONLY_ACCESS_TOKEN
      remoteRef:
        key: coder-launch-darkly-notegen-reader-token
