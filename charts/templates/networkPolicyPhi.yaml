{{- if .Values.networkPolicyPhi }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coder-phi-workspace
  namespace: coder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coder-phi-workspace
  policyTypes:
    - Egress
  egress:
    # PHI Compliance: All egress traffic is blocked for maximum security
    # No external network access is permitted for PHI workspaces
    - ports:
        - port: 53
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
{{- end }}
