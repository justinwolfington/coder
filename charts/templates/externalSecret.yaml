---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coder-github
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secret-manager
  target:
    name: coder-github-app
    creationPolicy: Owner
    # template:
    #   type: Opaque
    #   data:
    #     CODER_OAUTH2_GITHUB_CLIENT_ID: "{{ .CODER_OAUTH2_GITHUB_CLIENT_ID }}"
    #     CODER_OAUTH2_GITHUB_CLIENT_SECRET: "{{ .CODER_OAUTH2_GITHUB_CLIENT_SECRET }}"
    #     CODER_OAUTH2_GITHUB_APP_ID: "{{ .CODER_OAUTH2_GITHUB_APP_ID }}"
    #     CODER_REPO_READ_ACCESS_PAT: "{{ .CODER_REPO_READ_ACCESS_PAT }}"
    #     .gitconfig: |
    #       [credential]
    #         helper = store
    #     .git-credentials: |
    #       https://x-access-token:{{ .CODER_REPO_READ_ACCESS_PAT }}@github.com
  data:
    - secretKey: CODER_OAUTH2_GITHUB_CLIENT_ID
      remoteRef:
        key: coder-github-app-client-id
    - secretKey: CODER_OAUTH2_GITHUB_CLIENT_SECRET
      remoteRef:
        key: coder-github-app-client-secret
    - secretKey: CODER_OAUTH2_GITHUB_APP_ID
      remoteRef:
        key: coder-github-app-id
    # this token has read only access to the coder repo
    - secretKey: CODER_REPO_READ_ACCESS_PAT 
      remoteRef:
        key: coder-github-repo-read-pat
