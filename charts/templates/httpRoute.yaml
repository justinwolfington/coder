apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  namespace: coder
spec:
  hostnames:
  - coder.abridge.coffee
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-infra-internal
    namespace: gateway-infra
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: coder
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
