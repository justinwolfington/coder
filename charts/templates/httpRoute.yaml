apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  namespace: coder
spec:
  hostnames:
  {{- if .Values.coder.httpRoute.hostnames }}
  {{- range .Values.coder.httpRoute.hostnames }}
  - "{{ . }}"
  {{- end }}
  {{- else }}
  - "{{ .Values.coder.httpRoute.hostname }}"
  {{- end }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-infra-internal
    namespace: gateway-infra
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: coder
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: coder-redirect
  namespace: coder
spec:
  hostnames:
  {{- if .Values.coder.httpRoute.hostnames }}
  {{- range .Values.coder.httpRoute.hostnames }}
  - "{{ . }}"
  {{- end }}
  {{- else }}
  - "{{ .Values.coder.httpRoute.hostname }}"
  {{- end }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-infra-internal
    namespace: gateway-infra
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
