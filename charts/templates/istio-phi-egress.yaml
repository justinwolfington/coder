{{- if and .Values.phiIstio .Values.phiIstio.enabled }}
{{- $allHosts := concat ( .Values.phiIstio.allowedHosts | default list ) ( .Values.phiIstio.allowedHttpHosts | default list ) -}}
---
# ServiceEntry for allowed external hosts
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: phi-allowed-external
  namespace: {{ .Release.Namespace }}
spec:
  exportTo:
    - "."
  hosts:
  {{- range $allHosts }}
    - {{ . | quote }}
  {{- end }}
  ports:
    - number: 443
      name: tls
      protocol: TLS
    - number: 80
      name: http
      protocol: HTTP
  resolution: DNS
  location: MESH_EXTERNAL
---
# Sidecar to restrict egress for PHI workspaces
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: phi-restrict-egress
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: coder-phi-workspace
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  egress:
    - port:
        number: 443
        protocol: TLS
        name: tls
      hosts:
      {{- range .Values.phiIstio.allowedHosts }}
        - ./{{ . }}
      {{- end }}
    - port:
        number: 80
        protocol: HTTP
        name: http
      hosts:
      {{- range .Values.phiIstio.allowedHttpHosts }}
        - ./{{ . }}
      {{- end }}
    - hosts:
        - ./*
        - kube-system/*

{{- range $allHosts }}
---
# DestinationRule for {{ . }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: phi-dr-{{ . | replace "." "-" }}
  namespace: {{ $.Release.Namespace }}
spec:
  host: {{ . | quote }}
  exportTo:
    - "."
  trafficPolicy:
    tls:
      mode: DISABLE
{{- end }}
{{- end }}
